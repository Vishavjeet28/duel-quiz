services:
  - type: web
    name: duel-backend
    env: node
    buildCommand: npm install && npx prisma generate && npx prisma db push
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: duel-db
          property: connectionString
      - key: PORT
        value: "3001"

databases:
  - name: duel-db
    databaseName: duel
    user: duel
